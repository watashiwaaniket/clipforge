name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env for compose
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import base64, os, pathlib, secrets
          path = pathlib.Path(".env")
          text = path.read_text()
          lines = text.splitlines()
          def fill(key: str, value: str) -> None:
              for i, line in enumerate(lines):
                  if line.startswith(f"{key}="):
                      lines[i] = f"{key}={value}"
                      return
              lines.append(f"{key}={value}")
          fill("ENCRYPTION_KEY", base64.urlsafe_b64encode(os.urandom(32)).decode())
          fill("JWT_SECRET", secrets.token_hex(32))
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Boot backend compose stack
        run: docker compose up -d --build --wait db redis api

      - name: Run migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Lint backend with ruff
        run: docker compose exec -T api ruff check app tests

      - name: Run backend tests
        run: docker compose exec -T api pytest

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Typecheck and build frontend
        env:
          AUTH_SECRET: ci-build-auth-secret-placeholder-value
          JWT_SECRET: ci-build-jwt-secret-placeholder-value-32chars
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npx tsc --noEmit && npm run build

